[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrgcms"
version = "1.0.0"
description = "Preprocessing and machine learning for pyrolysis GC-MS biosignature data"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["pyrolysis", "gc-ms", "mass-spectrometry", "biosignature", "random-forest"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]
plots = ["matplotlib>=3.7"]

[project.scripts]
pyrgcms = "pyrgcms.cli:main"

[project.urls]
Paper = "https://www.pnas.org/doi/abs/10.1073/pnas.2307149120"
Data = "https://osf.io/embh8/"
Original-R-code = "https://github.com/ghystad/Machine_learning_and_preprocessing_pyr_GSMS_data"

[tool.setuptools.packages.find]
include = ["pyrgcms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::RuntimeWarning:pyrgcms.*",
]

[tool.coverage.run]
source = ["pyrgcms"]
omit = ["pyrgcms/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
# The species vector mirrors the R `c(rep(...), ...)` call line for line;
# rewriting it as unpacking would obscure that correspondence.
"pyrgcms/species.py" = ["RUF005"]
